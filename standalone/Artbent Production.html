  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

weight:600;color:#2A231C\" style-hover=\"background:#F7F2E9\"><span style=\"width:9px;height:9px;border-radius:50%;background:#5E7345\"><\u002Fspan>Косметика<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdetails>\n        <a href=\"Artbent%20Production.html\" style=\"color:#B24A28;font-weight:700\">Производство<\u002Fa>\n        <a href=\"Artbent%20Contacts.html\">Контакты<\u002Fa>\n      <\u002Fnav>\n      <div class=\"show-sm\" style=\"flex:1\"><\u002Fdiv>\n      <div class=\"hide-sm\" style=\"display:flex;align-items:center;gap:3px;font-family:'JetBrains Mono',monospace;font-size:12px\">\n        <span data-lang=\"ru\" style=\"padding:4px 8px;border-radius:6px\">RU<\u002Fspan>\n        <span data-lang=\"en\" style=\"padding:4px 8px;border-radius:6px\">EN<\u002Fspan>\n        <span data-lang=\"hy\" style=\"padding:4px 8px;border-radius:6px\">ՀԱՅ<\u002Fspan>\n      <\u002Fdiv>\n      <a href=\"Artbent%20Contacts.html\" style=\"font-weight:700;font-size:14px;padding:10px 18px;border-radius:9px;background:#B24A28;color:#FBF8F2\">Запросить КП<\u002Fa>\n      <details class=\"m-menu nav-burger\" style=\"position:relative\">\n        <summary style=\"width:42px;height:42px;border-radius:10px;border:1.5px solid #2A231C;display:flex;align-items:center;justify-content:center;font-size:19px;color:#2A231C\">☰<\u002Fsummary>\n        <div class=\"m-panel\" style=\"position:absolute;right:0;top:calc(100% + 12px);flex-direction:column;gap:3px;background:#FBF8F2;border:1px solid #E2D8C6;border-radius:14px;box-shadow:0 24px 50px -20px rgba(42,35,28,0.5);padding:10px;min-width:230px;z-index:70\">\n          <a href=\"Artbent%20Landing.html\" style=\"padding:11px 14px;border-radius:9px;font-weight:600;font-size:15px;color:#2A231C;text-decoration:none\" style-hover=\"background:#F7F2E9\">Продукция<\u002Fa>\n          <a href=\"Artbent%20Industry.html\" style=\"padding:11px 14px;border-radius:9px;font-weight:600;font-size:15px;color:#2A231C;text-decoration:none\" style-hover=\"back       <div style=\"display:flex;gap:26px\">\n        <div><div style=\"font-family:'Spectral',serif;font-weight:700;font-size:30px;color:#B24A28\">5<\u002Fdiv><div style=\"font-size:13px;color:#786C5C\">этапов цикла<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'Spectral',serif;font-weight:700;font-size:30px;color:#B24A28\">100%<\u002Fdiv><div style=\"font-size:13px;color:#786C5C\">партий в лаборатории<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:280px;border-radius:18px;overflow:hidden;border:1px solid #E2D8C6;margin-top:32px;position:relative;background:linear-gradient(178deg,#D8B879 0%,#D8B879 14%,#C79A55 14%,#C79A55 30%,#B07E42 30%,#B07E42 48%,#915F30 48%,#915F30 66%,#6E4626 66%,#6E4626 84%,#4E3220 84%,#4E3220 100%)\">\n      <div style=\"position:absolute;left:18px;top:16px;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,0.82);background:rgba(42,35,28,0.32);padding:6px 12px;border-radius:6px\">широкое фото: цех / карьер<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PROCESS STEPS -->\n  <section style=\"max-width:1100px;margin:0 auto;padding:56px 28px\">\n    <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:#A9733C;margin-bottom:24px\">Этапы производства<\u002Fdiv>\n    <div class=\"g-5 reveal\" style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:14px\">\n      <div style=\"background:#FBF8F2;border:1px solid #E2D8C6;border-radius:14px;padding:20px;border-top:3px solid #C28A3C\">\n        <div style=\"font-family:'Spectral',serif;font-weight:700;font-size:15px;color:#A9733C;margin-bottom:12px\">01<\u002Fdiv>\n        <div style=\"font-family:'Spectral',serif;font-weight:600;font-size:18px;margin-bottom:8px\">Сырьё<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#786C5C;line-height:1.5\">Добыча и входной контроль глины.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid #E2D8C6;border-radius:14px;padding:20px;border-top:3px solid #B98A4E\">\n        <div style=\"font-family:'Spectral',serif;font-weight:700;font-size:15px;color:#A9733C;margin-bottom:12px\">02<\u002Fdiv>\n        <div style=\"font-family:'Spectral',serif;font-weight:600;font-size:18px;margin-bottom:8px\">Активация<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#786C5C;line-height:1.5\">Модификация под нужные свойства.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid #E2D8C6;border-radius:14px;padding:20px;border-top:3px solid #A9733C\">\n        <div style=\"font-family:'Spectral',serif;font-weight:700;font-size:15px;color:#A9733C;margin-bottom:12px\">03<\u002Fdiv>\n        <div style=\"font-family:'Spectral',serif;font-weight:600;font-size:18px;margin-bottom:8px\">Помол<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#786C5C;line-height:1.5\">Сушка и измельчение до фракции.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid #E2D8C6;border-radius:14px;padding:20px;border-top:3px solid #8C5A30\">\n        <div style=\"font-family:'Spectral',serif;font-weight:700;font-size:15px;color:#A9733C;margin-bottom:12px\">04<\u002Fdiv>\n        <div style=\"font-family:'Spectral',serif;font-weight:600;font-size:18px;margin-bottom:8px\">Контроль<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#786C5C;line-height:1.5\">Лабораторная проверка показателей.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FBF8F2;border:1px solid #E2D8C6;border-radius:14px;padding:20px;border-top:3px solid #6E4626\">\n        <div style=\"font-family:'Spectral',serif;font-weight:700;font-size:15px;color:#A9733C;margin-bottom:12px\">05<\u002Fdiv>\n        <div style=\"font-family:'Spectral',serif;font-weight:600;font-size:18px;margin-bottom:8px\">Фасовка<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#786C5C;line-height:1.5\">МКР и мешки, маркировка, отгрузка.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LAB + CERTS -->\n  <section style=\"background:#2A231C;color:#EFE8DB\">\n    <div class=\"g-2 reveal\" style=\"max-width:1100px;margin:0 auto;padding:58px 28px;display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:#C28A3C;margin-bottom:14px\">Контроль качества<\u002Fdiv>\n        <h2 style=\"font-family:'Spectral',serif;font-weight:600;font-size:34px;line-height:1.12;margin:0 0 16px\">Лаборатория на каждой партии<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.6;color:#C9BEAD;margin:0 0 22px\">Каждая партия проходит проверку ключевых показателей перед отгрузкой. На марку выдаётся паспорт качества и SDS.<\u002Fp>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9A8F7E;border:1px dashed rgba(239,232,219,0.3);padding:7px 14px;border-radius:8px\">сертификат ISO<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9A8F7E;border:1px dashed rgba(239,232,219,0.3);padding:7px 14px;border-radius:8px\">сертификат API<\u002Fspan>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#9A8F7E;border:1px dashed rgba(239,232,219,0.3);padding:7px 14px;border-radius:8px\">паспорт качества<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n        <div style=\"height:130px;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(178deg,#B07E42,#5E3D22)\"><div style=\"position:absolute;left:12px;bottom:10px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:rgba(255,255,255,0.82);background:rgba(42,35,28,0.32);padding:4px 9px;border-radius:6px\">лаборатория<\u002Fdiv><
